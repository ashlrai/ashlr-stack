name: CI

# PR and merge_group run one fast required check (CI Gate): typecheck,
# Tier-1 security tests and the secret scan. The full suite (Bun matrix,
# site build, lint) runs twice a day on main and on workflow_dispatch; a red
# scheduled run files a P0 FIX-MAIN issue (fix-main.yml). Push to main no
# longer runs CI: the merge queue already ran the gate on the merged tree.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    # 6 AM and 6 PM ET (EDT, UTC-4).
    - cron: "13 10 * * *"
    - cron: "13 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs only. Scheduled and merge_group runs keep one
# group per commit (github.sha), so no main or queue run is ever cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: Typecheck + Tier-1 security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.4-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-1.4.4-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck (root workspace)
        run: bunx tsc --noEmit -p tsconfig.json
      - name: Tier-1 security tests
        run: |
          bun test packages/core/src/__tests__/security.test.ts packages/core/src/__tests__/secret-redaction.test.ts
          bun run check:crypto

  test:
    name: Test + typecheck (Bun ${{ matrix.bun }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.2.0", "latest"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docs-only PRs skip the steps below, but the job still runs and reports,
      # so the required check never strands. docs/provider-auth-matrix.md (read
      # by provider-parity.test.ts) and README.md (read by release-preflight)
      # count as code. Pushes, dispatches, other PRs and an unreadable diff run
      # everything.
      - name: Classify changes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          code=true
          # G1: draft PRs skip the heavy steps; the job name still reports.
          if [ "$DRAFT" = "true" ]; then code=false; fi
          if [ "$EVENT" = "pull_request" ] && files="$(git diff --name-only "$BASE...HEAD")" && [ -n "$files" ]; then
            if ! printf '%s\n' "$files" | grep -Ev '^(docs/provider-auth-matrix\.md|README\.md)$' | grep -Evq '^(docs/[^/]+\.md|[A-Za-z_-]+\.md|LICENSE)$' && ! printf '%s\n' "$files" | grep -Eq '^(docs/provider-auth-matrix\.md|README\.md)$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "full suite: $code"

      - uses: oven-sh/setup-bun@v2
        if: steps.scope.outputs.code == 'true'
        with:
          bun-version: ${{ matrix.bun }}

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ matrix.bun }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-${{ matrix.bun }}-

      - name: Install
        if: steps.scope.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Typecheck (root workspace)
        if: steps.scope.outputs.code == 'true'
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Test (bun test)
        if: steps.scope.outputs.code == 'true'
        run: bun test

      - name: Smoke test CLI help
        if: steps.scope.outputs.code == 'true'
        run: bun run packages/cli/src/index.ts --help

      - name: Smoke test providers list
        if: steps.scope.outputs.code == 'true'
        run: bun run packages/cli/src/index.ts providers

      - name: Smoke test stack recommend --json
        if: steps.scope.outputs.code == 'true'
        run: |
          set -e
          OUT=$(bun run packages/cli/src/index.ts recommend "B2B SaaS with auth and payments" --json)
          echo "$OUT" | node -e "
            const p = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
            if (!Array.isArray(p.hits) || p.hits.length === 0) throw new Error('no hits');
            const names = p.hits.map(h => h.name);
            if (!names.includes('stripe')) throw new Error('stripe not in hits');
            console.log('stack recommend smoke ok: ' + names.join(', '));
          "

      # The npm packages ship Bun-built bundles that run under Node >= 20.
      # Build them and drive both under Node 20 so Node compat can't regress.
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: "20"

      - name: Smoke test dist bundles under Node 20
        if: steps.scope.outputs.code == 'true'
        run: |
          bun run --cwd packages/cli build
          bun run --cwd packages/mcp build
          node packages/cli/dist/index.js --help > /dev/null
          node scripts/node-smoke.mjs

      # Packs the three npm packages as scripts/publish.sh ships them, installs
      # the tarballs together and drives the installed bins through the
      # surface Phantom uses (status --json, MCP stack_status/stack_list).
      - name: Release preflight (pack, install, Phantom contract)
        if: steps.scope.outputs.code == 'true' && (matrix.bun == 'latest')
        run: node scripts/release-preflight.mjs

  site:
    name: Site build (astro check + build)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        if: github.event.pull_request.draft != true
        with:
          bun-version: latest

      - name: Cache Bun install
        if: github.event.pull_request.draft != true
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-latest-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-latest-

      - name: Install root
        if: github.event.pull_request.draft != true
        run: bun install --frozen-lockfile

      - name: Install site deps
        if: github.event.pull_request.draft != true
        working-directory: packages/site
        run: bun install --frozen-lockfile

      - name: astro check
        if: github.event.pull_request.draft != true
        working-directory: packages/site
        run: bunx astro check

      - name: astro build
        if: github.event.pull_request.draft != true
        working-directory: packages/site
        run: bun run build

      # The build regenerates the CLI reference from the command modules, so
      # the deployed site is always current; this keeps the committed copy
      # (what reviewers and source readers see) from drifting behind it.
      - name: CLI reference is committed up to date
        if: github.event.pull_request.draft != true
        run: git diff --exit-code -- packages/site/src/lib/cli-ref.generated.ts || { echo "::error::Run 'bun packages/site/scripts/gen-cli-ref.ts' and commit packages/site/src/lib/cli-ref.generated.ts"; exit 1; }

      - name: Smoke — key public routes exist in dist/
        if: github.event.pull_request.draft != true
        working-directory: packages/site
        run: |
          set -e
          test -f dist/index.html
          test -f dist/docs/index.html
          test -f dist/docs/for-ai-agents/index.html
          test -f dist/openapi.json
          test -f dist/mcp.json
          test -f dist/.well-known/ai-plugin.json
          test -f dist/llms.txt
          test -f dist/sitemap-0.xml
          echo "All public routes present."

      - name: Validate public JSON is actually JSON
        if: github.event.pull_request.draft != true
        working-directory: packages/site
        run: |
          for f in dist/openapi.json dist/mcp.json dist/.well-known/ai-plugin.json dist/manifest.webmanifest; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf-8')); console.log('ok: $f')"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docs-only PRs skip the steps below, but the job still runs and reports,
      # so the required check never strands. docs/provider-auth-matrix.md (read
      # by provider-parity.test.ts) and README.md (read by release-preflight)
      # count as code. Pushes, dispatches, other PRs and an unreadable diff run
      # everything.
      - name: Classify changes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          code=true
          # G1: draft PRs skip the heavy steps; the job name still reports.
          if [ "$DRAFT" = "true" ]; then code=false; fi
          if [ "$EVENT" = "pull_request" ] && files="$(git diff --name-only "$BASE...HEAD")" && [ -n "$files" ]; then
            if ! printf '%s\n' "$files" | grep -Ev '^(docs/provider-auth-matrix\.md|README\.md)$' | grep -Evq '^(docs/[^/]+\.md|[A-Za-z_-]+\.md|LICENSE)$' && ! printf '%s\n' "$files" | grep -Eq '^(docs/provider-auth-matrix\.md|README\.md)$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "full suite: $code"

      - uses: oven-sh/setup-bun@v2
        if: steps.scope.outputs.code == 'true'
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-latest-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-latest-

      - name: Install
        if: steps.scope.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Biome check
        if: steps.scope.outputs.code == 'true'
        run: bunx biome check . --reporter=github

  secret-scan:
    # Security floor: diff-only secret scan on every event, pinned Gitleaks
    # 8.30.0 (sha256-verified). No path filter and no if-condition; the gate
    # fails unless this job succeeds (skipped or cancelled fails closed).
    name: Secret scan (diff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version
      - name: Scan the commits this event adds
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$(git merge-base "$PR_BASE" "$HEAD_SHA")" ;;
            merge_group) base="$MG_BASE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base="${HEAD_SHA}~1"; fi
          # A PR must not allowlist its own leak: ignore any repo-supplied config.
          rm -f .gitleaks.toml .gitleaksignore
          echo "scanning ${base}..${HEAD_SHA}"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --log-opts="${base}..${HEAD_SHA}" --redact --no-banner --max-target-megabytes 5 --timeout 120

  # The one required check. PR and merge_group need the fast job and the
  # secret scan; scheduled and dispatch runs also need the full suite. Any
  # needed job that is not success (failure, cancelled or skipped) fails it.
  gate:
    name: CI Gate
    if: always()
    needs: [fast, secret-scan, test, site, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every needed job
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          full=false
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then full=true; fi
          bad="$(printf '%s' "$NEEDS" | jq -r --argjson full "$full" 'to_entries[] | select(.value.result != "success") | select(($full | not) and (.key == "test" or .key == "site" or .key == "lint") and .value.result == "skipped" | not) | "\(.key)=\(.value.result)"')"
          if [ -n "$bad" ]; then echo "::error::CI Gate: $bad"; exit 1; fi
          echo "CI Gate passed ($EVENT)"
