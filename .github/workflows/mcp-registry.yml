name: MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# Auth: GitHub OIDC, no stored secrets. The npm version named in server.json must
# already be published with a matching "mcpName", or the registry rejects it.
# Public release evidence uses unauthenticated API reads: rate limits or API
# outages fail closed. Retry the exact-tag manual dispatch when available.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Prereleases may be created before their producers finish; dispatch on the
    # exact tag after release.yml completes instead of waiting on a runner. Stable
    # events that arrive before the producer finishes also require a later dispatch.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && toJSON(github.event.release.prerelease) == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Require completed exact release and reconcile registry
        id: gate
        run: node scripts/mcp-registry-gate.mjs prepare
      - name: Install mcp-publisher
        if: steps.gate.outputs.action == 'publish'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null
      - name: Login (GitHub OIDC)
        if: steps.gate.outputs.action == 'publish'
        run: ./mcp-publisher login github-oidc
      - name: Recheck and publish once
        if: steps.gate.outputs.action == 'publish'
        run: node scripts/mcp-registry-gate.mjs publish
