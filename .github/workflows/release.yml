name: Release

on:
  push:
    tags: ['v*.*.*']
  # Dispatch builds an existing tag (auto-tag dispatches here after it creates
  # one). Only a dispatch from main runs: a dispatch runs the chosen ref's
  # copy of this file, so an edited branch copy must not reach publish.
  # Pass either tag (vX.Y.Z) or version (X.Y.Z, builds tag v<version>); when
  # both are given they must agree. One is required (checked in build-binaries).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, for example v0.1.0 (or pass version instead)'
        required: false
        type: string
      version:
        description: 'Released version X.Y.Z; builds existing tag v<version>'
        required: false
        type: string
      npm_otp:
        description: 'Unsupported legacy input; any nonempty value refuses before release work'
        required: false
        default: ''

permissions:
  contents: read

env:
  # Tag push: the pushed tag. Dispatch: the tag input, or v<version> when only
  # version is given (both validated in build-binaries).
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && (inputs.tag || format('v{0}', inputs.version)) || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && (inputs.tag || format('v{0}', inputs.version)) || github.ref_name }}
  cancel-in-progress: false

jobs:
  full-suite-evidence:
    # Resolve the selected tag before checking manual full CI. A dispatch's
    # github.sha is main's workflow revision, not necessarily the release source.
    name: Full suite green on release sha
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.evidence.outputs.sha }}
    steps:
      - name: Require manual full CI on the resolved release commit
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_INPUT_OTP: ${{ github.event.inputs.npm_otp }}
          CI_WORKFLOW: ci.yml
        run: |
          set -euo pipefail
          # Refuse unsupported OTP before subprocesses; never echo its value.
          [[ -z "${RELEASE_INPUT_OTP:-}" ]] || { echo "::error::release input/source validation failed"; exit 1; }
          unset RELEASE_INPUT_OTP
          if [ "${GITHUB_EVENT_NAME:-}" = workflow_dispatch ]; then
            if [ -n "$INPUT_VERSION" ]; then
              [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version input is not X.Y.Z"; exit 1; }
              [ -z "$INPUT_TAG" ] || [ "$INPUT_TAG" = "v$INPUT_VERSION" ] || { echo "::error::tag and version inputs disagree"; exit 1; }
            elif [ -z "$INPUT_TAG" ]; then
              echo "::error::workflow_dispatch requires a tag or version input"; exit 1
            fi
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::release tag input is not a valid vX.Y.Z tag"; exit 1; }
          # Fetch only tag data into an empty bare repo, never execute tag code.
          # ^{commit} peels annotated tags and refuses tags pointing at non-commits.
          proof_dir="$(mktemp -d "$RUNNER_TEMP/release-proof.XXXXXX")"
          trap 'rm -rf "$proof_dir"' EXIT
          git init --bare "$proof_dir" >/dev/null
          git --git-dir="$proof_dir" fetch --no-tags --depth=1 "$REPO_URL" "refs/tags/$RELEASE_TAG"
          SHA="$(git --git-dir="$proof_dir" rev-parse --verify 'FETCH_HEAD^{commit}')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release tag did not resolve to a commit"; exit 1; }
          if [ "${GITHUB_EVENT_NAME:-}" = push ]; then
            [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" && "$GITHUB_SHA" == "$SHA" ]] || { echo "::error::pushed tag no longer matches release commit"; exit 1; }
          fi
          runs="$(gh api "repos/${REPO}/actions/workflows/${CI_WORKFLOW}/runs?event=workflow_dispatch&head_sha=${SHA}&status=success&per_page=100")"
          if ! printf '%s' "$runs" | jq -e --arg sha "$SHA" '(.workflow_runs | type == "array") and (.workflow_runs | any(.event == "workflow_dispatch" and .head_sha == $sha and .status == "completed" and .conclusion == "success"))' >/dev/null; then
            echo "::error::No successful workflow_dispatch run of ${CI_WORKFLOW} on ${SHA}. Run 'gh workflow run ${CI_WORKFLOW} -R ${REPO} --ref ${RELEASE_TAG}', verify head_sha=${SHA} and wait for green, then release."
            exit 1
          fi
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"
          echo "full suite green on ${RELEASE_TAG} at ${SHA}"

  build-binaries:
    needs: [full-suite-evidence]
    name: Build ${{ matrix.asset }}
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-latest
            asset: stack-linux-x64
          - target: bun-linux-arm64
            os: ubuntu-latest
            asset: stack-linux-arm64
          # Bun cross-compiles to every target from any host and ad-hoc signs
          # the Mach-O itself (LC_CODE_SIGNATURE is present when built on
          # Linux), and this binary is never executed on its runner, so it is
          # built on ubuntu. On macos-latest it queued behind the arm64 build
          # for the shared macOS slots: 4h40m before a 20s compile on v0.2.1.
          - target: bun-darwin-x64
            os: ubuntu-latest
            asset: stack-darwin-x64
          # Cross-compiled here too, so npm never waits for a macOS slot (2h24m
          # on v0.2.1). smoke-darwin-arm64 still runs it natively before the
          # GitHub Release and Homebrew formula point at it.
          - target: bun-darwin-arm64
            os: ubuntu-latest
            asset: stack-darwin-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.full-suite-evidence.outputs.sha }}
          fetch-depth: 0

      - name: Validate release source before producers
        env:
          RELEASE_INPUT_OTP: ${{ github.event.inputs.npm_otp }}
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          die() { printf '%s\n' 'release input/source validation failed' >&2; exit 1; }
          # OTP is unsupported: refuse before any subprocess, install or producer.
          [[ -z "${RELEASE_INPUT_OTP:-}" ]] || die
          unset RELEASE_INPUT_OTP
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            [[ -z "${RELEASE_INPUT_VERSION:-}" || "$RELEASE_INPUT_VERSION" == "$VERSION" ]] || die
          else
            VERSION="${RELEASE_TAG#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || die
          command -v node >/dev/null 2>&1 || die
          # Read source data only; these guards do not establish publisher or archive authority.
          if ! node --input-type=module - "$VERSION" <<'STACK_RELEASE_SOURCE'
          import { lstatSync, readFileSync } from 'node:fs';
          try {
            const version = process.argv[2];
            const read = (path) => {
              const stat = lstatSync(path);
              if (!stat.isFile() || stat.isSymbolicLink()) throw new Error();
              return readFileSync(path, 'utf8');
            };
            const manifests = ['core', 'mcp', 'cli'].map((name) =>
              JSON.parse(read(`packages/${name}/package.json`)));
            if (manifests.some((pkg) => pkg.version !== version)) throw new Error();
            if (typeof manifests[1].name !== 'string' || !manifests[1].name) throw new Error();
            const descriptor = JSON.parse(read('packages/mcp/server.json'));
            const entries = Array.isArray(descriptor.packages)
              ? descriptor.packages.filter((pkg) => pkg.registryType === 'npm'
                && pkg.identifier === manifests[1].name) : [];
            if (descriptor.version !== version || entries.length !== 1
                || entries[0].version !== version) throw new Error();
            const cli = read('packages/cli/src/index.ts');
            const declarations = [...cli.matchAll(/^const[ \t]+VERSION[ \t]*=[ \t]*([^;\r\n]+);[ \t]*$/gm)];
            if (declarations.length !== 1) throw new Error();
            const literal = declarations[0][1].trim().match(/^(["'])([^"'\r\n]+)\1$/);
            if (!literal || literal[2] !== version) throw new Error();
          } catch {
            process.exit(1);
          }
          STACK_RELEASE_SOURCE
          then
            die "source version validation failed"
          fi
          # Check the selected tag (pushed, or dispatched and checked out) is HEAD.
          if [[ "${GITHUB_REF:-}" == refs/tags/* || "${GITHUB_EVENT_NAME:-}" == workflow_dispatch ]]; then
            [[ "$RELEASE_TAG" == "v$VERSION" ]] || die "selected tag validation failed"
            TAG_COMMIT="$(git rev-parse --verify "refs/tags/v$VERSION^{commit}" 2>/dev/null)" || die "selected tag validation failed"
            HEAD_COMMIT="$(git rev-parse --verify HEAD 2>/dev/null)" || die "selected tag validation failed"
            [[ -n "$TAG_COMMIT" && "$TAG_COMMIT" == "$HEAD_COMMIT" ]] || die "selected tag validation failed"
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Compile standalone binary
        run: |
          mkdir -p dist
          bun build packages/cli/src/index.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile=dist/${{ matrix.asset }}
          chmod +x dist/${{ matrix.asset }}

      - name: Generate SHA-256
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          else
            shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          fi
          cat ${{ matrix.asset }}.sha256

      - name: Smoke test (native arch only)
        # Only run the binary when it matches the runner arch: the others are
        # cross-compiled on an x64 Linux runner, so they cannot execute there.
        # darwin-arm64 is run natively by smoke-darwin-arm64.
        if: matrix.target == 'bun-linux-x64'
        run: |
          ./dist/${{ matrix.asset }} --help | head -20
          ./dist/${{ matrix.asset }} providers | head -5

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}*
          retention-days: 7

  smoke-darwin-arm64:
    name: Smoke stack-darwin-arm64 natively
    needs: build-binaries
    if: ${{ !cancelled() && needs.build-binaries.result == 'success' }}
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stack-darwin-arm64
          path: dist

      - name: Verify checksum and run the binary
        working-directory: dist
        run: |
          set -euo pipefail
          shasum -a 256 -c stack-darwin-arm64.sha256
          chmod +x stack-darwin-arm64
          ./stack-darwin-arm64 --help | head -20
          ./stack-darwin-arm64 providers | head -5

  publish-npm:
    permissions:
      contents: read
      id-token: write   # npm OIDC trusted publishing + provenance
    name: Publish to npm
    needs: [full-suite-evidence, build-binaries]
    runs-on: ubuntu-latest
    # Producer success is necessary; npm success alone does not prove registry bytes.
    if: ${{ !cancelled() && needs.build-binaries.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    steps:
      # npm trusted publishing (OIDC): with id-token: write and npm >= 11.5.1,
      # npm exchanges the workflow identity for a short-lived publish token.
      # No NPM_TOKEN or OTP needed once each package (@ashlr/stack-core,
      # @ashlr/stack, ashlr-stack-mcp) lists ashlrai/ashlr-stack release.yml
      # as a trusted publisher on npmjs.com. No token fallback: if the OIDC
      # exchange fails, the publish fails closed (the NPM_TOKEN secret lacks write).
      - name: Enable npm publish
        id: gate
        run: echo "enabled=true" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.full-suite-evidence.outputs.sha }}
          fetch-depth: 0   # scripts/publish.sh uses git tag

      - if: steps.gate.outputs.enabled == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - if: steps.gate.outputs.enabled == 'true'
        name: Validate release source before installs
        id: ver
        env:
          RELEASE_INPUT_OTP: ${{ github.event.inputs.npm_otp }}
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          die() { printf '%s\n' 'release input/source validation failed' >&2; exit 1; }
          # OTP is unsupported: refuse before any subprocess, install or producer.
          [[ -z "${RELEASE_INPUT_OTP:-}" ]] || die
          unset RELEASE_INPUT_OTP
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            [[ -z "${RELEASE_INPUT_VERSION:-}" || "$RELEASE_INPUT_VERSION" == "$VERSION" ]] || die
          else
            VERSION="${RELEASE_TAG#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || die
          command -v node >/dev/null 2>&1 || die
          # Read source data only; these guards do not establish publisher or archive authority.
          if ! node --input-type=module - "$VERSION" <<'STACK_RELEASE_SOURCE'
          import { lstatSync, readFileSync } from 'node:fs';
          try {
            const version = process.argv[2];
            const read = (path) => {
              const stat = lstatSync(path);
              if (!stat.isFile() || stat.isSymbolicLink()) throw new Error();
              return readFileSync(path, 'utf8');
            };
            const manifests = ['core', 'mcp', 'cli'].map((name) =>
              JSON.parse(read(`packages/${name}/package.json`)));
            if (manifests.some((pkg) => pkg.version !== version)) throw new Error();
            if (typeof manifests[1].name !== 'string' || !manifests[1].name) throw new Error();
            const descriptor = JSON.parse(read('packages/mcp/server.json'));
            const entries = Array.isArray(descriptor.packages)
              ? descriptor.packages.filter((pkg) => pkg.registryType === 'npm'
                && pkg.identifier === manifests[1].name) : [];
            if (descriptor.version !== version || entries.length !== 1
                || entries[0].version !== version) throw new Error();
            const cli = read('packages/cli/src/index.ts');
            const declarations = [...cli.matchAll(/^const[ \t]+VERSION[ \t]*=[ \t]*([^;\r\n]+);[ \t]*$/gm)];
            if (declarations.length !== 1) throw new Error();
            const literal = declarations[0][1].trim().match(/^(["'])([^"'\r\n]+)\1$/);
            if (!literal || literal[2] !== version) throw new Error();
          } catch {
            process.exit(1);
          }
          STACK_RELEASE_SOURCE
          then
            die "source version validation failed"
          fi
          # Check the selected tag (pushed, or dispatched and checked out) is HEAD.
          if [[ "${GITHUB_REF:-}" == refs/tags/* || "${GITHUB_EVENT_NAME:-}" == workflow_dispatch ]]; then
            [[ "$RELEASE_TAG" == "v$VERSION" ]] || die "selected tag validation failed"
            TAG_COMMIT="$(git rev-parse --verify "refs/tags/v$VERSION^{commit}" 2>/dev/null)" || die "selected tag validation failed"
            HEAD_COMMIT="$(git rev-parse --verify HEAD 2>/dev/null)" || die "selected tag validation failed"
            [[ -n "$TAG_COMMIT" && "$TAG_COMMIT" == "$HEAD_COMMIT" ]] || die "selected tag validation failed"
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.enabled == 'true'
        name: Use an npm CLI that supports trusted publishing
        run: npm install -g npm@11.19.0 && npm --version

      - if: steps.gate.outputs.enabled == 'true'
        name: Install deps
        run: bun install --frozen-lockfile

      - if: steps.gate.outputs.enabled == 'true'
        name: Inject OAuth client IDs
        env:
          OAUTH_SUPABASE_CLIENT_ID: ${{ secrets.OAUTH_SUPABASE_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_ID:   ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
        run: node scripts/inject-client-ids.mjs

      # Packs and installs the three tarballs and drives the installed bins
      # before the first real publish, so a broken package cannot land half
      # published (core is on npm before cli and mcp).
      - if: steps.gate.outputs.enabled == 'true'
        name: Preflight packed packages
        run: |
          bun run --cwd packages/cli build
          bun run --cwd packages/mcp build
          node scripts/release-preflight.mjs

      - if: steps.gate.outputs.enabled == 'true'
        name: Publish @ashlr/stack-core + @ashlr/stack + ashlr-stack-mcp
        id: npm_publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          bash scripts/publish.sh --version "$RELEASE_VERSION" --yes

      - if: failure() && steps.gate.outputs.enabled == 'true' && steps.npm_publish.outcome == 'failure'
        name: Preserve failed npm publish evidence
        run: |
          echo '::warning title=npm publish failed::Preserve logs and artifacts; reconcile registry state before any further release action.'

      - if: always() && steps.gate.outputs.enabled == 'true'
        name: Restore env.ts (never commit injected client IDs)
        run: git checkout -- packages/core/src/env.ts || true

  create-release:
    permissions:
      contents: write   # create GitHub Release + upload assets
    name: Create GitHub Release
    # Producer, native macOS smoke and npm job success are required before this downstream effect.
    needs: [full-suite-evidence, build-binaries, smoke-darwin-arm64, publish-npm]
    if: ${{ !cancelled() && needs.build-binaries.result == 'success' && needs.smoke-darwin-arm64.result == 'success' && needs.publish-npm.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.full-suite-evidence.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: ver
        env:
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            [[ -z "${RELEASE_INPUT_VERSION:-}" || "$RELEASE_INPUT_VERSION" == "$VERSION" ]] || exit 1
          else
            VERSION="${RELEASE_TAG#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { printf '%s\n' 'release version validation failed' >&2; exit 1; }
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          HEAD_COMMIT="$(git rev-parse --verify HEAD)"
          [[ "$TAG_COMMIT" == "$HEAD_COMMIT" ]] || { echo "::error::release tag changed after qualification"; exit 1; }
          printf 'version=%s\ntag=v%s\n' "$VERSION" "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write release body
        id: body
        run: |
          cat > release-body.md <<'EOF'
          Ashlr Stack ${{ steps.ver.outputs.tag }}.

          ## Install

          ```sh
          curl -fsSL https://stack.ashlr.ai/install.sh | bash
          ```

          Or via npm:

          ```sh
          npm install -g @ashlr/stack@${{ steps.ver.outputs.version }}
          ```

          ## Binaries

          Prebuilt for macOS (arm64 + x64) and Linux (arm64 + x64). SHA-256
          checksums are published alongside each asset.

          ## What's next

          ```sh
          stack init
          stack add supabase
          stack doctor
          ```
          EOF
          echo "path=release-body.md" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: ${{ steps.body.outputs.path }}
          files: |
            dist/stack-linux-x64
            dist/stack-linux-x64.sha256
            dist/stack-linux-arm64
            dist/stack-linux-arm64.sha256
            dist/stack-darwin-x64
            dist/stack-darwin-x64.sha256
            dist/stack-darwin-arm64
            dist/stack-darwin-arm64.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: [full-suite-evidence, build-binaries, publish-npm, create-release]
    # Only run on v*.*.* tag pushes (not workflow_dispatch version bumps)
    if: |
      !cancelled() &&
      needs.build-binaries.result == 'success' &&
      needs.publish-npm.result == 'success' &&
      needs.create-release.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check for tap-write credential
        id: cred_check
        # Deploy key only: no long-lived PAT. Add HOMEBREW_TAP_DEPLOY_KEY (write
        # deploy key on ashlrai/homebrew-ashlr) to enable formula updates.
        run: |
          if [ -n "${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}" ]; then
            echo "method=ssh" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Homebrew tap not updated::HOMEBREW_TAP_DEPLOY_KEY is not set, skipping formula update. Add a write deploy key on ashlrai/homebrew-ashlr and store its private key as HOMEBREW_TAP_DEPLOY_KEY."
            echo "method=skip" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cred_check.outputs.method != 'skip'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.full-suite-evidence.outputs.sha }}
          path: stack-repo

      - if: steps.cred_check.outputs.method != 'skip'
        name: Download SHA-256 files from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p sha256s
          gh release download "${TAG}" -R ashlrai/ashlr-stack -p "*.sha256" -D sha256s/

      - if: steps.cred_check.outputs.method == 'ssh'
        name: Checkout homebrew tap (SSH auth)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ashlrai/homebrew-ashlr
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - if: steps.cred_check.outputs.method != 'skip'
        name: Generate Formula/stack.rb from template
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_DARWIN_ARM64=$(awk '{print $1}' sha256s/stack-darwin-arm64.sha256)
          SHA_DARWIN_X64=$(awk  '{print $1}' sha256s/stack-darwin-x64.sha256)
          SHA_LINUX_ARM64=$(awk '{print $1}' sha256s/stack-linux-arm64.sha256)
          SHA_LINUX_X64=$(awk   '{print $1}' sha256s/stack-linux-x64.sha256)

          sed \
            -e 's/\$VERSION\$/'"${VERSION}"'/g' \
            -e 's/\$SHA_DARWIN_ARM64\$/'"${SHA_DARWIN_ARM64}"'/g' \
            -e 's/\$SHA_DARWIN_X64\$/'"${SHA_DARWIN_X64}"'/g' \
            -e 's/\$SHA_LINUX_ARM64\$/'"${SHA_LINUX_ARM64}"'/g' \
            -e 's/\$SHA_LINUX_X64\$/'"${SHA_LINUX_X64}"'/g' \
            stack-repo/.github/homebrew-formula.template.rb \
            > homebrew-tap/Formula/stack.rb

      - if: steps.cred_check.outputs.method != 'skip'
        name: Commit and push updated formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd homebrew-tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/stack.rb
          git diff --cached --quiet && echo "No formula changes — already up to date." && exit 0
          git commit -m "feat: stack v${VERSION}" -m "Assisted-By: ashlr-plugin <https://plugin.ashlr.ai>"
          git push
