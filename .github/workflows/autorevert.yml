name: Autorevert

# RQ-AUTOREVERT pilot. Deterministic, no model, no new secrets.
# When CI on a push to main fails twice (one automatic rerun of the failed
# jobs rules out flakes), open a revert PR of the culprit commit, enable
# auto-merge and dispatch CI on the revert branch so the required checks
# report (GITHUB_TOKEN events do not start pull_request runs, but
# workflow_dispatch is the documented exception). Release failures open an
# issue only. Spec: phantom-work/ci-efficiency/autorevert-spec.md.

on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run id to evaluate (dry run prints the decision, opens nothing)
        required: true

concurrency:
  group: autorevert
  cancel-in-progress: false

permissions: {}

jobs:
  autorevert:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.name == 'Release'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write        # rerun failed jobs once, dispatch CI on the revert branch
      contents: write       # push the autorevert/<sha> branch
      pull-requests: write  # open the revert PR and enable auto-merge
      issues: write         # kill switch and release-failure issues
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MAIN: ${{ github.event.repository.default_branch }}
      DRY: ${{ github.event_name == 'workflow_dispatch' }}
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          persist-credentials: true
      - name: Decide and act
        run: bash .github/scripts/autorevert.sh
