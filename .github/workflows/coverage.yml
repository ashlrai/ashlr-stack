name: Coverage

# Coverage runs in the merge queue only, so pull requests and pushes stay
# on the plain test command in ci.yml. The test job has no id-token.
# The upload job is the only job here with id-token: write.
on:
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: Test coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test with coverage
        run: |
          set -euo pipefail
          bun test --coverage --coverage-reporter=lcov
          if [ ! -s coverage/lcov.info ]; then
            echo "coverage/lcov.info is missing"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 1

  upload:
    name: Upload coverage
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # No checkout: this job runs no repo code, it only uploads the artifact.
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lcov
          path: coverage

      - name: Require coverage file
        run: test -s coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage/lcov.info
